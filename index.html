<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f0d4a8">
  <title>Little Racer</title>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f0d4a8; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #hint { position: fixed; left: 50%; bottom: max(8vh, 40px); transform: translateX(-50%); padding: 14px 26px;
      border-radius: 999px; background: rgba(255, 250, 238, 0.92); color: #7a2a14; font-weight: 700;
      font-size: clamp(18px, 3.4vw, 30px); letter-spacing: .2px; box-shadow: 0 6px 24px rgba(90, 40, 10, .25);
      transition: opacity .8s ease; pointer-events: none; text-align: center; max-width: 86vw; }
    #hint.gone { opacity: 0; }
    #cue { position: fixed; left: 50%; top: 30%; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none;
      opacity: 0; transition: opacity .5s ease; will-change: transform, opacity; }
    #cue.on { opacity: 1; }
    #cue .dot { position: absolute; inset: 18px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff6c8, #ffc83a 55%, #ff8a1c); box-shadow: 0 0 28px 8px rgba(255, 190, 60, .75);
      animation: beat 1.1s ease-in-out infinite; }
    #cue .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .85);
      animation: ripple 1.1s ease-out infinite; }
    #gauge { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
      width: clamp(110px, 22vw, 200px); height: 22px; border-radius: 12px; padding: 3px; box-sizing: border-box;
      background: rgba(255, 250, 238, .85); box-shadow: 0 4px 16px rgba(90, 40, 10, .25); pointer-events: none; }
    #gauge .track { position: relative; width: 100%; height: 100%; border-radius: 8px; overflow: hidden; background: rgba(120, 90, 60, .2); }
    #gauge .fill { position: absolute; inset: 0; width: 100%; border-radius: 8px; clip-path: inset(0 100% 0 0);
      background: linear-gradient(90deg, #3ecf5a 0%, #b6e03a 35%, #ffd23a 60%, #ff8a1c 80%, #ff3d3d 100%); }
    @keyframes beat { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.12); } }
    @keyframes ripple { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      #cue .dot { animation: none; } #cue .ring { animation: none; opacity: .5; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="A friendly red race car drives through a desert town. Tap, click or press any key to drive." role="img" tabindex="-1"></canvas>
  <div id="cue"><div class="ring"></div><div class="dot"></div></div>
  <div id="gauge" aria-hidden="true"><div class="track"><div class="fill"></div></div></div>
  <div id="hint">Tap or press any key to start!</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
